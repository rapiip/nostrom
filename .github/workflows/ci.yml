name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Contracts + ABI drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx hardhat compile
      - run: npx hardhat test
      # abis.ts is generated from the compiled artifacts and committed. If a
      # contract changed without `npm run app:abis`, the frontend would call a
      # stale interface; fail here instead. The banner's generation date is the
      # only line allowed to differ. `--text` because .gitattributes marks the
      # file -diff, which would otherwise reduce this to "binary files differ".
      - name: Frontend ABIs match the compiled contracts
        run: |
          node frontend/scripts/sync-abis.mjs
          git diff --text --exit-code -I '^ \* Generated ' -- frontend/src/contracts/abis.ts

  frontend:
    name: Frontend lint, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # `build` runs `tsc --noEmit` first, so this is also the type check.
      - run: npm run build
